name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://dashboard:dashboard_dev_password@localhost:5432/shopify_dashboard

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard_dev_password
          POSTGRES_DB: shopify_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d shopify_dashboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Prisma migrations
        run: pnpm -C apps/api exec prisma migrate deploy

      - name: Backend unit tests
        run: pnpm -C apps/api exec jest -c jest.config.cjs --testPathIgnorePatterns=src/__tests__

      - name: Backend integration tests
        run: pnpm -C apps/api exec jest -c jest.config.cjs --runInBand src/__tests__

      - name: Frontend unit tests
        run: pnpm -C apps/web test

      - name: Build web
        run: pnpm build:web

      - name: Build api
        run: pnpm build:api
